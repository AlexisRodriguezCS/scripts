name: PowerShell CI

on:
  push:
    branches: [ main ]
  workflow_dispatch:
  pull_request:
    branches: [ main ]

jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
      with:
        fetch-depth: 0   # scan the whole history, not just the latest commit

    - name: Scan for leaked secrets
      uses: gitleaks/gitleaks-action@v2
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  lint:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v5

    - name: Run PSScriptAnalyzer
      shell: pwsh
      run: |
        # The PowerShell Gallery occasionally fails a lookup; retry before failing the build
        foreach ($attempt in 1..3) {
          try { Install-Module PSScriptAnalyzer -Force -Scope CurrentUser -ErrorAction Stop; break }
          catch { if ($attempt -eq 3) { throw }; Start-Sleep -Seconds (10 * $attempt) }
        }
        # ParseError = broken syntax; the Error filter alone lets those through
        $results = Invoke-ScriptAnalyzer -Path . -Recurse -Severity Error, ParseError
        $results | Format-Table -AutoSize
        if ($results) { exit 1 }

  test:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v5

    - name: Install Pester
      shell: pwsh
      run: |
        foreach ($attempt in 1..3) {
          try { Install-Module -Name Pester -MinimumVersion 5.0 -Force -Scope CurrentUser -SkipPublisherCheck -ErrorAction Stop; break }
          catch { if ($attempt -eq 3) { throw }; Start-Sleep -Seconds (10 * $attempt) }
        }

    - name: Run Pester tests
      shell: pwsh
      run: |
        $config = New-PesterConfiguration
        $config.Run.Path = './Tests'
        $config.Run.Exit = $true
        $config.Output.Verbosity = 'Detailed'
        Invoke-Pester -Configuration $config
